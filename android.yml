name: Android APK

# Builds the Yotei Android app and attaches the APK to a GitHub release.
# Run it from the Actions tab (Run workflow), or push a tag like v3.1.0.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Optional. With both set the APK is signed with your own key, so every new build installs over the last one.
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Collect the web files
        run: node build-www.mjs

      - name: Create the Android project
        run: npx cap add android

      - name: Set version and icons
        run: node android-prepare.mjs
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Copy the web files into the Android project
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Sign with your key
        if: env.KEYSTORE_B64 != ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > yotei-release.p12
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks yotei-release.p12 --ks-key-alias yotei --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "Yotei-$VERSION.apk" aligned.apk
          "$BT/apksigner" verify --print-certs "Yotei-$VERSION.apk"
          rm -f yotei-release.p12 aligned.apk
          echo "APK_PATH=Yotei-$VERSION.apk" >> "$GITHUB_ENV"
          echo "Signed with your key: new builds install over the old one and keep your data." >> "$GITHUB_STEP_SUMMARY"

      - name: Use the debug-signed APK
        if: env.KEYSTORE_B64 == ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "Yotei-$VERSION-debug.apk"
          echo "APK_PATH=Yotei-$VERSION-debug.apk" >> "$GITHUB_ENV"
          echo "No signing key set, so this is a debug build. A later build will NOT install over it (uninstall first)." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep a copy with the run
        uses: actions/upload-artifact@v4
        with:
          name: Yotei-apk
          path: ${{ env.APK_PATH }}

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Yotei build {0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          body: Open this page on your Android phone and tap the .apk file to install it.
          files: ${{ env.APK_PATH }}
